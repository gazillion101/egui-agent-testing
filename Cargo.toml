[package]
name = "egui-agent-testing"
version = "0.1.0"
edition = "2024"
description = "A small egui app that an AI agent can see and drive, with accessibility-tree tests that walk the whole interface"
license = "MIT"

[dependencies]
eframe = "0.35"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
egui = "0.35"
egui_kittest = { version = "0.35", features = ["eframe"] }
